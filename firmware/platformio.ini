; Atom Air — M5Stack ATOM Lite firmware.
;
; Three build targets. The first two mirror the SOTA pipeline; the third is a
; bench tool that shares nothing with them but the board.
;   atom_base   : sensor + MQTT + HTTP OTA client. Flashed over USB first.
;   atom_ac     : base + IRremoteESP8266 (IRsend/IRrecv). Never flashed over USB
;                 in the field — the gateway pushes it over the store LAN when
;                 an AC model is picked in the web UI.
;   atom_irbench: standalone IR 학습·송신 벤치 (src/ir_bench.cpp). No Wi-Fi, no
;                 MQTT. Point a remote at G25, press the front button to resend.
;
;   pio run -e atom_base -t upload        # initial USB flash
;   pio run -e atom_ac                    # build the OTA image
;   python stage_firmware.py              # stage it where the gateway serves it
;   pio run -e atom_irbench -t upload     # bench tool, USB only
;
; src/ holds one entry point per target, so every env names the single file it
; compiles. Without that, adding a second main()/setup() breaks all of them.

[platformio]
default_envs = atom_base

[env]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<main.cpp>
; min_spiffs keeps the dual OTA app slots but grows them to ~1.9MB each —
; the atom_ac image with IRremoteESP8266's full protocol set needs the room.
; Both envs must share one partition table: the USB-flashed base image and the
; OTA-delivered AC image land in the same layout.
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    fastled/FastLED@^3.6.0
    ; temperature/humidity sensors, auto-detected on the Grove port at boot
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit SHT4x Library@^1.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

[env:atom_base]

[env:atom_ac]
build_flags = -DHAS_IR
lib_deps =
    ${env.lib_deps}
    crankyoldgit/IRremoteESP8266@^2.8.6

; Nothing from the store firmware is wanted here — no FastLED in particular,
; which is why the sketch can drive the LED with neopixelWrite() and leave the
; RMT peripheral to IRremoteESP8266.
[env:atom_irbench]
build_src_filter = -<*> +<ir_bench.cpp>
lib_deps = crankyoldgit/IRremoteESP8266@^2.8.6
